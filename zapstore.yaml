# zapstore.yaml — Excultus
# Configuration for zsp (https://github.com/zapstore/zsp), which publishes the app on
# Zapstore (https://zapstore.dev), a decentralized Android app store built on Nostr.
#
# The APK comes from the latest GitHub Release (created by the
# .github/workflows/release.yml workflow). Full guide: docs/zapstore.md

repository: https://github.com/misesdev/Excultus
website: https://github.com/misesdev/Excultus

name: Excultus

summary: "Offline-first audio library: import, download and listen to courses, audiobooks, podcasts and music"

description: |
  Excultus is an open-source app to build your personal audio library and listen to it
  offline. No account, no backend, no ads and no analytics: everything stays on your device.

  Available in English and Portuguese: the app follows your device language and can be
  switched in Settings.

  IMPORT FROM ANYWHERE

  - Items from the Internet Archive (archive.org)
  - YouTube videos and playlists, with the audio downloaded as M4A
  - Direct audio links and files from your device

  DOWNLOADS THAT DON'T GET LOST

  A download queue with pause and resume, automatic retries, integrity checks and disk
  space control.

  A FULL-FEATURED PLAYER

  Background playback with a media notification and lock screen controls, playback speed,
  skip, queue, repeat and shuffle, sleep timer, bookmarks and resume where you left off.

  ORGANIZATION

  Collections, playlists, favorites, history and full-text search. JSON backup and restore.

  Open source under the GPL-3.0-or-later license.

license: GPL-3.0-or-later

tags:
  - audio
  - player
  - podcast
  - audiobook
  - music
  - offline
  - youtube
  - internet-archive
  - privacy
  - open-source

icon: ./android/app/src/main/ic_launcher-playstore.png

images:
  - ./store/screenshots/01-home.jpg
  - ./store/screenshots/02-collections.jpg
  - ./store/screenshots/03-player.jpg
  - ./store/screenshots/04-downloads.jpg

# Release notes: the published version's section (Keep a Changelog format).
release_notes: ./CHANGELOG.md
